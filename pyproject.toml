[project]
name = "gpt2-repro"
version = "0.1.0"
description = "A from-scratch reproduction of GPT-2 pretraining, classification, and instruction tuning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets",
    "huggingface-hub",
    "numpy",
    "pyarrow>=25.0.1",
    "safetensors",
    "tiktoken>=0.14.0",
    "torch",
    "transformers>=5.17.0",
    "wandb>=0.30.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["model", "pretraining"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests requiring external models or services",
]
